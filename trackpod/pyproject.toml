[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackpod"
version = "0.1.0"
description = "Local-first music library manager with device sync (iPod / Android)"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "mutagen>=1.47",
    "yt-dlp>=2024.1.0",
    "spotipy>=2.23",
    "pyDes>=2.0.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
qt = ["PySide6>=6.6"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
trackpod = "trackpod.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trackpod"]

[tool.coverage.run]
source = ["trackpod"]

[tool.pytest.ini_options]
testpaths = ["tests"]